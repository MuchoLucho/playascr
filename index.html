<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a">
  <meta name="color-scheme" content="light dark">
  <script>
    try {
      const savedTheme = localStorage.getItem("color-scheme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.querySelector('meta[name="color-scheme"]').content = savedTheme;
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {}
  </script>
  <meta name="description" content="Mapa interactivo de las playas de Costa Rica con indicadores de comportamiento costero, corrientes de resaca, seguridad familiar, surf, accesos y color de arena.">
  <title>PlayasCR — Atlas de Playas de Costa Rica</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg">

  <!-- Google Fonts: Fredoka (Headings/Brand), Pacifico (Surf Accent), Plus Jakarta Sans (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="map" role="application" aria-label="Mapa de Playas de Costa Rica"></div>

  <!-- Floating Top Controls -->
  <header class="top-shell">
    <div class="top-row">
      <div class="brand-bar">
        <div class="brand-id">
          <img src="./assets/icon.svg" alt="PlayasCR" class="brand-logo">
          <div class="brand-text">
            <h1 class="brand-title" data-i18n="app.title">Playas de Costa Rica</h1>
            <p class="brand-sub" data-i18n="app.subtitle">Atlas Interactivo de Seguridad y Comportamiento Costero</p>
          </div>
        </div>
        <div class="brand-controls">
          <button type="button" id="theme-toggle" class="theme-toggle-btn" data-i18n-aria="app.themeToggle" data-i18n-title="app.themeToggle" aria-label="Cambiar tema" title="Cambiar tema">
            <span class="theme-icon-light" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </span>
            <span class="theme-icon-dark" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </span>
          </button>
          <div id="lang-switch" class="lang-switch" role="group" aria-label="Idioma / Language"></div>
        </div>
      </div>

      <div class="search-actions-wrap">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
          <input
            type="search"
            id="search-input"
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="app.searchPlaceholder"
            data-i18n-aria="app.searchPlaceholder"
            placeholder="Buscar playa o lugar (ej. Tamarindo, Conchal, Manuel Antonio)..."
          >
          <button type="button" id="clear-search" class="clear-btn" data-i18n-aria="app.clearSearch" aria-label="Limpiar búsqueda"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          <div id="search-results" class="search-results" role="listbox"></div>
        </div>

        <div class="header-actions">
          <button type="button" id="btn-guide" class="pill-btn primary">
            <span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/><circle cx="12" cy="12" r="4"/></svg></span>
            <span class="btn-text" data-i18n="app.guideBtn">Guía Resacas</span>
          </button>
          <button type="button" id="btn-about" class="pill-btn">
            <span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
            <span class="btn-text" data-i18n="app.aboutBtn">Fuente</span>
          </button>
          <a href="https://github.com/MuchoLucho/playascr" target="_blank" rel="noopener noreferrer" id="btn-collab" class="pill-btn" data-i18n-title="app.collabTitle" title="Colaborar en GitHub (Código abierto)">
            <span class="btn-icon" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon lucide-git-fork" aria-hidden="true"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/></svg></span>
            <span class="btn-text" data-i18n="app.collabBtn">Colaborar</span>
          </a>
        </div>
      </div>
    </div>

    <div class="chips-strip">
      <div id="filter-chips" style="display:contents"></div>
      <span id="beaches-count" class="count-pill"></span>
    </div>
  </header>

  <!-- Bottom-Left Map Layer & Indicator Controls -->
  <div class="map-controls-left">
    <div class="basemap-toggle" role="group" data-i18n-aria="app.basemapLabel" aria-label="Mapa base">
      <button type="button" class="basemap-btn active" data-basemap="street" data-i18n="app.basemapStreet">Mapa</button>
      <button type="button" class="basemap-btn" data-basemap="satellite" data-i18n="app.basemapSatellite">Satélite</button>
      <button type="button" class="basemap-btn" data-basemap="topo" data-i18n="app.basemapTopo">Relieve</button>
    </div>
    <div class="lens-card">
      <div class="lens-row">
        <span class="lens-label" data-i18n="app.lensLabel">Indicador en mapa</span>
        <select id="lens-select" class="lens-select" aria-label="Indicador en mapa"></select>
      </div>
      <div id="legend-items" class="legend-items"></div>
    </div>
    <a href="https://github.com/MuchoLucho" target="_blank" rel="noopener noreferrer" class="credit-pill" title="GitHub: @MuchoLucho">
      <span data-i18n="app.madeByPrefix">Hecho con</span>
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="#CE1126" stroke="#CE1126" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon heart-icon" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
      <span><span data-i18n="app.madeByMiddle">por</span> <strong>Lucho</strong></span>
    </a>
  </div>

  <!-- Bottom-Right Zoom & GPS FAB Controls -->
  <div class="map-controls-right">
    <div class="fab-stack">
      <button type="button" id="btn-zoom-in" class="fab-btn" aria-label="Acercar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      <button type="button" id="btn-zoom-out" class="fab-btn" aria-label="Alejar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" id="btn-locate" class="fab-btn" data-i18n-aria="app.locateMe" aria-label="Mi ubicación"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
  </div>

  <!-- Responsive Beach Detail Drawer (Desktop Side Panel / Mobile Swipeable Sheet) -->
  <aside id="beach-drawer" class="drawer" aria-live="polite">
    <div id="drawer-handle" class="drawer-handle" aria-hidden="true"></div>
    <div class="drawer-header">
      <div class="drawer-title-wrap">
        <h2 id="drawer-title" class="drawer-title"></h2>
        <div id="drawer-badges" class="drawer-badges"></div>
      </div>
      <button type="button" id="drawer-close" class="drawer-close" data-i18n-aria="drawer.close" aria-label="Cerrar ficha"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- Educational Rip-Current Safety Guide Modal -->
  <div id="guide-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="guide-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="guide-modal-title" data-i18n="guide.title">Guía de Corrientes de Resaca</h2>
        <button type="button" class="drawer-close" data-close-modal="guide-modal" aria-label="Cerrar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div id="guide-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Source & Attribution Modal -->
  <div id="about-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="about-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="about-modal-title" data-i18n="about.title">Fuente y Atribución de Datos</h2>
        <button type="button" class="drawer-close" data-close-modal="about-modal" aria-label="Cerrar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="modal-body">
        <p style="margin:0" data-i18n="about.text1"></p>
        <div style="margin-top:6px">
          <a href="https://www.ict.go.cr/es/servicios-institucionales/atlas-de-playas.html" target="_blank" rel="noopener noreferrer" class="pill-btn primary" style="display:inline-flex;text-decoration:none;font-size:0.82rem;gap:6px;">
            <span class="btn-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon lucide-external-link" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            </span>
            <span data-i18n="about.portalLink">Descargar / Consultar en Portal Oficial ICT</span>
          </a>
        </div>
        <p style="margin:0" data-i18n="about.text2"></p>
        <p style="margin:0;color:var(--text-muted);font-size:0.82rem" data-i18n="about.text3"></p>
        <p style="margin:0;color:var(--text-muted);font-size:0.82rem" data-i18n="about.text4"></p>
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
          <a href="https://github.com/MuchoLucho/playascr" target="_blank" rel="noopener noreferrer" class="pill-btn" style="text-decoration:none;font-size:0.8rem;gap:6px;">
            <span class="btn-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon lucide-git-fork" aria-hidden="true"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/></svg>
            </span>
            <span data-i18n="app.collabRepo">Colaborar en GitHub</span>
          </a>
          <a href="https://github.com/MuchoLucho" target="_blank" rel="noopener noreferrer" style="font-size:0.8rem;color:var(--text-muted);display:inline-flex;align-items:center;gap:4px;text-decoration:none;">
            <span data-i18n="app.madeByPrefix">Hecho con</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="#CE1126" stroke="#CE1126" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide-icon heart-icon" aria-hidden="true"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
            <span data-i18n="app.madeByMiddle">por</span>
            <strong style="color:var(--brand)">Lucho</strong>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
