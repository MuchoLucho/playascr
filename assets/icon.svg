<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Costa Rica Beach Logo">
  <defs>
    <clipPath id="emblem-clip">
      <circle cx="150" cy="155" r="115" />
    </clipPath>
  </defs>

  <!-- Outer Emblem Ring -->
  <circle cx="150" cy="155" r="115" fill="#FFFFFF" stroke="#0B2B6B" stroke-width="8" />

  <!-- Clipped Interior Elements -->
  <g clip-path="url(#emblem-clip)">
    <!-- Costa Rican Flag Stripes Background -->
    <rect x="30" y="35" width="240" height="36" fill="#0B2B6B" />
    <rect x="30" y="71" width="240" height="24" fill="#FFFFFF" />
    <rect x="30" y="95" width="240" height="58" fill="#CE1126" />
    <rect x="30" y="153" width="240" height="24" fill="#FFFFFF" />
    <rect x="30" y="177" width="240" height="95" fill="#0B2B6B" />

    <!-- White Halo around Sun -->
    <circle cx="168" cy="160" r="56" fill="#FFFFFF" />
    <!-- Red Rising Sun -->
    <circle cx="168" cy="160" r="42" fill="#CE1126" />

    <!-- Ocean Horizon & Right Swell -->
    <path d="M 135 162 L 265 162 L 265 215 L 135 215 Z" fill="#1E56A0" />
    <path d="M 145 174 Q 185 168, 225 174 T 265 174" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 155 186 Q 195 194, 260 184" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />

    <!-- Curling Wave -->
    <path d="M 78 235 C 78 165, 132 135, 162 156 C 144 158, 140 178, 165 188 C 195 198, 232 184, 258 194 L 245 235 Z" fill="#FFFFFF" />
    <path d="M 85 230 C 85 172, 132 145, 155 158 C 138 162, 136 184, 164 193 C 195 202, 232 190, 254 198 L 235 235 Z" fill="#1E56A0" />
    <path d="M 85 230 C 92 196, 118 175, 135 168 C 122 184, 128 202, 162 208 C 188 212, 215 205, 235 204 L 220 240 Z" fill="#0B2B6B" />

    <!-- White Wave Foam & Dark Blue Sand Base -->
    <path d="M 78 206 Q 112 204, 145 218 T 232 206" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 65 235 Q 135 256, 235 206 L 265 215 L 265 275 L 55 275 Z" fill="#0B2B6B" stroke="#FFFFFF" stroke-width="6" />

    <!-- Flying Seagulls -->
    <path d="M 86 86 Q 96 81, 102 90 Q 108 82, 118 87 Q 108 87, 102 95 Q 96 87, 86 86 Z" fill="#0B2B6B" />
    <path d="M 74 102 Q 92 104, 100 116 Q 108 108, 120 114 Q 106 114, 98 123 Q 90 111, 74 102 Z" fill="#0B2B6B" />
    <path d="M 205 144 Q 214 141, 219 148 Q 224 141, 233 144 Q 224 146, 219 152 Q 214 146, 205 144 Z" fill="#0B2B6B" />
  </g>

  <!-- Curved Palm Trunk -->
  <path d="M 62 238 C 66 155, 118 118, 174 82 L 182 88 C 128 126, 82 164, 78 246 Z" fill="#0B2B6B" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />

  <!-- Palm Fronds Crown -->
  <g fill="#0B2B6B" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round">
    <path d="M 176 82 C 155 52, 125 36, 94 34 C 115 44, 128 52, 134 58 C 122 54, 110 54, 102 56 C 124 62, 148 72, 172 85 Z" />
    <path d="M 178 82 C 194 50, 222 34, 250 34 C 232 44, 220 52, 214 58 C 226 54, 236 54, 244 56 C 224 62, 202 72, 180 85 Z" />
    <path d="M 174 83 C 142 64, 110 66, 84 82 C 106 78, 122 80, 130 84 C 116 84, 104 88, 96 94 C 122 90, 148 86, 174 86 Z" />
    <path d="M 180 83 C 212 64, 244 66, 270 82 C 248 78, 232 80, 224 84 C 238 84, 250 88, 258 94 C 232 90, 206 86, 180 86 Z" />
    <path d="M 174 85 C 144 84, 118 100, 102 124 C 118 112, 132 106, 140 106 C 128 114, 122 124, 118 134 C 138 118, 156 102, 175 88 Z" />
    <path d="M 180 85 C 210 84, 236 100, 252 124 C 236 112, 222 106, 214 106 C 226 114, 232 124, 236 134 C 216 118, 198 102, 179 88 Z" />
    <path d="M 178 86 C 192 108, 194 134, 182 158 C 182 142, 180 130, 176 124 C 174 136, 170 146, 164 154 C 166 132, 170 108, 176 86 Z" />
  </g>
</svg>
