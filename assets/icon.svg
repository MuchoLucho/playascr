<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Official Costa Rica Blue gradient (Sky / Deep Ocean) -->
    <linearGradient id="crBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#001f5c"/>
      <stop offset="100%" stop-color="#002b7f"/>
    </linearGradient>
    <!-- Foreground Costa Rica Blue -->
    <linearGradient id="crBlueDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#002b7f"/>
      <stop offset="100%" stop-color="#001845"/>
    </linearGradient>
  </defs>

  <!-- App Icon Base: Costa Rica Blue (Upper Blue: 1 part) -->
  <rect width="128" height="128" rx="28" fill="url(#crBlue)"/>

  <!-- Pure White Sun in the sky -->
  <circle cx="96" cy="30" r="12" fill="#ffffff" opacity="0.95"/>

  <!-- Top White Wave Stripe (Flag Upper White band: 1 part) -->
  <path d="M6 56 Q34 42 64 53 T122 48" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Center Red Wave (Flag Central Red band: 2 parts / double-width) -->
  <path d="M6 68 C32 50 58 72 88 58 C102 52 114 56 122 60 L122 88 C106 84 88 90 72 84 C48 76 28 90 6 88 Z" fill="#ce1126"/>

  <!-- Lower White Surf Line (Flag Lower White band: 1 part) -->
  <path d="M6 89 Q36 78 66 86 T122 80" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>

  <!-- Lower Ocean Wave Base (Flag Lower Blue band: 1 part) -->
  <path d="M6 95 Q36 84 66 92 T122 86 L122 122 L6 122 Z" fill="url(#crBlueDeep)"/>
</svg>
